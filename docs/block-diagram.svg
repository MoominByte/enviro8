<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
 <defs><style>
 text{font-family:Segoe UI,Arial,sans-serif;fill:#eaf4f1}.title{font-size:34px;font-weight:700}.sub{font-size:17px;fill:#a9c1ba}.box{fill:#17252b;stroke:#4ad3a2;stroke-width:3}.sensor{fill:#1c3037;stroke:#6fb8ff;stroke-width:2}.pin{font-size:18px;font-weight:600}.small{font-size:15px;fill:#bdd0cb}.wire{fill:none;stroke-width:5}.sda{fill:none;stroke:#4ad3a2}.scl{fill:none;stroke:#f2c65c}.power{fill:none;stroke:#ef6a70}.gnd{fill:none;stroke:#8f9da2}.btn{fill:none;stroke:#b889ff}.arrow{marker-end:url(#a)}
 </style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b8c8c4"/></marker></defs>
 <rect width="1400" height="900" fill="#0d1519"/><text x="60" y="65" class="title">Enviro8 — wiring block diagram</text><text x="60" y="96" class="sub">XIAO ESP32-C6 + TCA9548A I²C multiplexer + 8 temperature/humidity sensors</text>
 <rect x="70" y="250" width="260" height="300" rx="20" class="box"/><text x="200" y="300" text-anchor="middle" font-size="27" font-weight="700">XIAO ESP32-C6</text><text x="105" y="365" class="pin">3V3</text><text x="105" y="415" class="pin">GND</text><text x="105" y="465" class="pin">D4 / GPIO22 / SDA</text><text x="105" y="515" class="pin">D5 / GPIO23 / SCL</text><text x="105" y="345" class="small">Wi-Fi + embedded web server</text>
 <rect x="520" y="210" width="310" height="380" rx="20" class="box"/><text x="675" y="260" text-anchor="middle" font-size="27" font-weight="700">TCA9548A</text><text x="555" y="320" class="pin">VCC / GND</text><text x="555" y="370" class="pin">SDA / SCL</text><text x="555" y="420" class="pin">A0=A1=A2=GND</text><text x="555" y="455" class="small">Adresse 0x70</text><text x="555" y="515" class="pin">SD0/SC0 … SD7/SC7</text>
 <path d="M330 360 H520" class="wire power"/><path d="M330 410 H520" class="wire gnd"/><path d="M330 460 H520" class="wire sda"/><path d="M330 510 H520" class="wire scl"/>
 <text x="400" y="350" class="small">3.3 V</text><text x="400" y="402" class="small">common ground</text>
 <rect x="65" y="650" width="275" height="120" rx="16" class="sensor"/><text x="202" y="695" text-anchor="middle" font-size="21" font-weight="700">BOOT/USER button</text><text x="202" y="728" text-anchor="middle" class="small">GPIO9 ↔ button ↔ GND</text><text x="202" y="752" text-anchor="middle" class="small">Hold 10 s after boot = factory reset</text><path d="M205 650 V550" class="wire btn"/>
 <g>
  <rect x="1010" y="135" width="310" height="70" rx="12" class="sensor"/><text x="1030" y="165" class="pin">CH1 — SHTxx</text><text x="1030" y="188" class="small">VDD, GND, SDA←SD0, SCL←SC0</text>
  <rect x="1010" y="220" width="310" height="70" rx="12" class="sensor"/><text x="1030" y="250" class="pin">CH2 — SHTxx</text><text x="1030" y="273" class="small">VDD, GND, SDA←SD1, SCL←SC1</text>
  <rect x="1010" y="305" width="310" height="70" rx="12" class="sensor"/><text x="1030" y="335" class="pin">CH3 — SHTxx</text><text x="1030" y="358" class="small">VDD, GND, SDA←SD2, SCL←SC2</text>
  <rect x="1010" y="390" width="310" height="70" rx="12" class="sensor"/><text x="1030" y="420" class="pin">CH4 — SHTxx</text><text x="1030" y="443" class="small">VDD, GND, SDA←SD3, SCL←SC3</text>
  <rect x="1010" y="475" width="310" height="70" rx="12" class="sensor"/><text x="1030" y="505" class="pin">CH5 — SHTxx</text><text x="1030" y="528" class="small">VDD, GND, SDA←SD4, SCL←SC4</text>
  <rect x="1010" y="560" width="310" height="70" rx="12" class="sensor"/><text x="1030" y="590" class="pin">CH6 — SHTxx</text><text x="1030" y="613" class="small">VDD, GND, SDA←SD5, SCL←SC5</text>
  <rect x="1010" y="645" width="310" height="70" rx="12" class="sensor"/><text x="1030" y="675" class="pin">CH7 — SHTxx</text><text x="1030" y="698" class="small">VDD, GND, SDA←SD6, SCL←SC6</text>
  <rect x="1010" y="730" width="310" height="70" rx="12" class="sensor"/><text x="1030" y="760" class="pin">CH8 — SHTxx</text><text x="1030" y="783" class="small">VDD, GND, SDA←SD7, SCL←SC7</text>
 </g>
 <g class="wire"><path d="M830 515 C920 515 920 170 1010 170" class="sda"/><path d="M830 525 C925 525 925 255 1010 255" class="scl"/><path d="M830 535 C930 535 930 340 1010 340" class="sda"/><path d="M830 545 C940 545 940 425 1010 425" class="scl"/><path d="M830 555 C950 555 950 510 1010 510" class="sda"/><path d="M830 565 C950 565 950 595 1010 595" class="scl"/><path d="M830 575 C940 575 940 680 1010 680" class="sda"/><path d="M830 585 C930 585 930 765 1010 765" class="scl"/></g>
 <rect x="420" y="650" width="420" height="100" rx="16" fill="#17342c" stroke="#4ad3a2" stroke-width="2"/><text x="630" y="687" text-anchor="middle" class="pin">Power supplied by the XIAO</text><text x="630" y="717" text-anchor="middle" class="small">3V3 pin → TCA9548A + eight sensors</text>
 <text x="70" y="845" class="small">Red: XIAO 3.3 V • Gray: GND • Green: SDA • Yellow: SCL • Purple: button</text>
</svg>
