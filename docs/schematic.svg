<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
 <defs><style>text{font-family:Consolas,Segoe UI,sans-serif;fill:#172126}.t{font:700 31px Segoe UI}.st{font:16px Segoe UI;fill:#516269}.part{fill:#fff;stroke:#172126;stroke-width:3}.wire{fill:none;stroke:#172126;stroke-width:3}.bus{fill:none;stroke:#087f68;stroke-width:5}.pwr{fill:none;stroke:#c72f3b;stroke-width:4}.label{font-size:17px}.pin{font-size:15px}.note{fill:#fff8d9;stroke:#b99722;stroke-width:2}.junction{fill:#172126}.gnd{fill:none;stroke:#172126;stroke-width:3}</style></defs>
 <rect width="1800" height="1200" fill="#f4f7f6"/><text x="55" y="60" class="t">Enviro8 — reference schematic</text><text x="55" y="92" class="st">3.3 V logic only • XIAO ESP32-C6 • TCA9548A @ 0x70 • 8 SHTxx branches</text>
 <!-- rails --> <path d="M80 145 H1720" class="pwr"/><text x="85" y="135" fill="#c72f3b" class="label">+3V3 supplied by the XIAO ESP32-C6</text><path d="M80 1080 H1720" class="wire"/><text x="85" y="1110" class="label">Common GND: XIAO, multiplexer, and sensors</text>
 <!-- MCU --> <rect x="100" y="300" width="310" height="430" rx="8" class="part"/><text x="255" y="340" text-anchor="middle" font-size="25" font-weight="700">U1 — XIAO ESP32-C6</text><text x="125" y="405" class="label">3V3 output</text><text x="125" y="455" class="label">GND</text><text x="125" y="525" class="label">D4 / GPIO22 (SDA)</text><text x="125" y="590" class="label">D5 / GPIO23 (SCL)</text><text x="125" y="670" class="label">GPIO9 (BOOT/USER)</text><path d="M180 300 V145" class="pwr"/><path d="M210 730 V1080" class="wire"/>
 <!-- main pullups --> <path d="M455 525 H600" class="bus"/><path d="M455 590 H600" class="bus"/><rect x="500" y="360" width="40" height="90" class="part"/><text x="520" y="410" text-anchor="middle" class="pin">R1</text><text x="520" y="430" text-anchor="middle" class="pin">4k7</text><path d="M520 360 V145" class="pwr"/><path d="M520 450 V525" class="wire"/><rect x="560" y="360" width="40" height="90" class="part"/><text x="580" y="410" text-anchor="middle" class="pin">R2</text><text x="580" y="430" text-anchor="middle" class="pin">4k7</text><path d="M580 360 V145" class="pwr"/><path d="M580 450 V590" class="wire"/>
 <!-- mux --> <rect x="650" y="250" width="400" height="650" rx="8" class="part"/><text x="850" y="290" text-anchor="middle" font-size="25" font-weight="700">U2 — TCA9548A</text><text x="675" y="340" class="pin">VCC</text><text x="675" y="380" class="pin">GND</text><text x="675" y="525" class="pin">SDA</text><text x="675" y="590" class="pin">SCL</text><text x="675" y="680" class="pin">A0</text><text x="675" y="720" class="pin">A1</text><text x="675" y="760" class="pin">A2</text><text x="675" y="820" class="pin">RESET</text><path d="M735 250 V145" class="pwr"/><path d="M760 900 V1080" class="wire"/><path d="M600 525 H650" class="bus"/><path d="M600 590 H650" class="bus"/><path d="M715 680 H610 V1080" class="wire"/><path d="M715 720 H610" class="wire"/><path d="M715 760 H610" class="wire"/><path d="M715 820 H620 V145" class="pwr"/><text x="625" y="790" class="pin">A0/A1/A2=0 → 0x70</text>
 <!-- decoupling --> <path d="M850 145 V180" class="pwr"/><path d="M820 180 H880" class="wire"/><path d="M820 200 H880" class="wire"/><path d="M850 200 V1080" class="wire"/><text x="890" y="195" class="pin">C1 100 nF</text>
 <!-- button --> <path d="M410 670 H500" class="wire"/><circle cx="525" cy="670" r="5" class="junction"/><path d="M500 670 H515 M535 670 H565" class="wire"/><path d="M565 670 V1080" class="wire"/><text x="485" y="705" class="pin">SW1 BOOT/USER (NO)</text><text x="455" y="730" class="pin">Hold for 10 seconds</text>
 <!-- mux outputs labels and buses -->
 <g class="pin"><text x="960" y="350">SD0 / SC0</text><text x="960" y="415">SD1 / SC1</text><text x="960" y="480">SD2 / SC2</text><text x="960" y="545">SD3 / SC3</text><text x="960" y="610">SD4 / SC4</text><text x="960" y="675">SD5 / SC5</text><text x="960" y="740">SD6 / SC6</text><text x="960" y="805">SD7 / SC7</text></g>
 <g class="bus"><path d="M1050 345 H1200"/><path d="M1050 410 H1200"/><path d="M1050 475 H1200"/><path d="M1050 540 H1200"/><path d="M1050 605 H1200"/><path d="M1050 670 H1200"/><path d="M1050 735 H1200"/><path d="M1050 800 H1200"/></g>
 <!-- channel connectors -->
 <g><rect x="1200" y="310" width="440" height="72" class="part"/><rect x="1200" y="390" width="440" height="72" class="part"/><rect x="1200" y="470" width="440" height="72" class="part"/><rect x="1200" y="550" width="440" height="72" class="part"/><rect x="1200" y="630" width="440" height="72" class="part"/><rect x="1200" y="710" width="440" height="72" class="part"/><rect x="1200" y="790" width="440" height="72" class="part"/><rect x="1200" y="870" width="440" height="72" class="part"/>
 <g class="label"><text x="1220" y="340">J1 / CH1</text><text x="1220" y="420">J2 / CH2</text><text x="1220" y="500">J3 / CH3</text><text x="1220" y="580">J4 / CH4</text><text x="1220" y="660">J5 / CH5</text><text x="1220" y="740">J6 / CH6</text><text x="1220" y="820">J7 / CH7</text><text x="1220" y="900">J8 / CH8</text></g><g class="pin"><text x="1360" y="340">1:3V3  2:GND  3:SDA  4:SCL</text><text x="1360" y="420">1:3V3  2:GND  3:SDA  4:SCL</text><text x="1360" y="500">1:3V3  2:GND  3:SDA  4:SCL</text><text x="1360" y="580">1:3V3  2:GND  3:SDA  4:SCL</text><text x="1360" y="660">1:3V3  2:GND  3:SDA  4:SCL</text><text x="1360" y="740">1:3V3  2:GND  3:SDA  4:SCL</text><text x="1360" y="820">1:3V3  2:GND  3:SDA  4:SCL</text><text x="1360" y="900">1:3V3  2:GND  3:SDA  4:SCL</text></g></g>
 <!-- connector common rails --> <path d="M1665 145 V940" class="pwr"/><path d="M1695 940 V1080" class="wire"/><g class="pwr"><path d="M1640 326 H1665"/><path d="M1640 406 H1665"/><path d="M1640 486 H1665"/><path d="M1640 566 H1665"/><path d="M1640 646 H1665"/><path d="M1640 726 H1665"/><path d="M1640 806 H1665"/><path d="M1640 886 H1665"/></g><g class="wire"><path d="M1640 345 H1695"/><path d="M1640 425 H1695"/><path d="M1640 505 H1695"/><path d="M1640 585 H1695"/><path d="M1640 665 H1695"/><path d="M1640 745 H1695"/><path d="M1640 825 H1695"/><path d="M1640 905 H1695"/></g>
 <rect x="1050" y="975" width="590" height="75" rx="8" class="note"/><text x="1070" y="1005" class="label">Each Jx: SHT4x/SHT3x (0x44) or SHT20 (0x40).</text><text x="1070" y="1032" class="pin">Add 100 nF at each sensor. Fit 4.7 kΩ SDA/SCL pull-ups unless already present.</text>
 <text x="55" y="1150" class="st">The 3.3 V rail comes from the XIAO 3V3 pin. Keep the total load within the board regulator's available current budget.</text><text x="55" y="1177" class="st">R1/R2: 2.2–4.7 kΩ. Check pull-ups already fitted to sensor breakouts to avoid excessive parallel loading.</text>
</svg>
