<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Enviro8</title><style>
:root{color-scheme:dark;--bg:#101417;--card:#192126;--line:#2b3940;--accent:#59d6a6;--muted:#9db0b8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef6f3;font:14px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:28px;margin:0}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.pill{background:#20342d;color:var(--accent);padding:7px 12px;border-radius:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card,section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.card.off{opacity:.55}.value{font-size:28px;font-weight:650;margin:10px 0}.meta{color:var(--muted);line-height:1.6}section{margin-top:16px}label{display:block;color:var(--muted);margin:8px 0 3px}input,select,button{width:100%;padding:9px;border-radius:7px;border:1px solid var(--line);background:#11181c;color:white}button{background:#28765d;border:0;font-weight:600;cursor:pointer;margin-top:12px}.danger{background:#803b3b}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.channel{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.actions{display:flex;gap:8px}.actions button{width:auto}small{color:var(--muted)}</style></head><body><main><header><div><h1>Enviro8</h1><small id="status">Connecting…</small></div><span class="pill">ESP32-C6</span></header><div id="cards" class="grid"></div>
<section><h2>Channels</h2><div id="channels" class="grid"></div><button onclick="saveChannels()">Save channel settings</button></section>
<section><h2>Network</h2><div class="cols"><div><label>Wi-Fi SSID</label><input id="ssid"><label>Password (leave unchanged if blank)</label><input id="password" type="password"></div><div><label><input id="dhcp" type="checkbox" style="width:auto"> Use DHCP</label><label>IP address</label><input id="ip"><label>Gateway</label><input id="gateway"></div><div><label>Netmask</label><input id="netmask"><label>DNS</label><input id="dns"></div></div><button onclick="saveNetwork()">Save network settings</button></section>
<section><h2>Device</h2><div class="actions"><button onclick="post('/api/v1/sensors/detect')">Detect sensors</button><button onclick="post('/api/v1/reboot')">Reboot</button><button class="danger" onclick="resetDevice()">Factory reset</button></div></section></main><script>
const types=['Disabled','Auto','SHT45','SHT41','SHT40','SHT35','SHT31','SHT30','SHT20','Other'];const $=x=>document.getElementById(x);async function api(url,opt){let r=await fetch(url,opt);if(!r.ok)throw Error(await r.text());return r.json()}function n(v,d=1){return typeof v==='number'?v.toFixed(d):'—'}
async function refresh(){try{let [s,st]=await Promise.all([api('/api/v1/sensors'),api('/api/v1/status')]);$('status').textContent=`v${st.firmwareVersion} · ${st.networkMode} · uptime ${Math.floor(st.uptimeSeconds)}s · RSSI ${st.wifiRssi} dBm`;$('cards').innerHTML=s.map(x=>`<div class="card ${x.online?'':'off'}"><b>CH${x.channel} · ${x.configuredType}</b><div class="value">${n(x.temperature)} °C</div><div class="value">${n(x.humidity)} %RH</div><div class="meta">${x.detectedFamily} · ${x.online?'Online':'Offline'}<br>Raw ${n(x.rawTemperature)} °C / ${n(x.rawHumidity)} %<br>Samples ${x.sampleCount} · Errors ${x.errorCount}</div></div>`).join('')}catch(e){$('status').textContent=e.message}}
async function loadConfig(){let c=await api('/api/v1/config'),v=c.network;for(let k of ['ssid','ip','gateway','netmask','dns'])$(k).value=v[k]||'';$('dhcp').checked=v.dhcp;$('channels').innerHTML=c.channels.map(x=>`<div class="channel" data-ch="${x.channel}"><b>CH${x.channel}</b><label>Sensor</label><select class="type">${types.map(t=>`<option ${t===x.type?'selected':''}>${t}</option>`).join('')}</select><label>Temperature offset °C</label><input class="to" type="number" step="0.01" value="${x.temperatureOffset}"><label>Humidity offset %RH</label><input class="ho" type="number" step="0.01" value="${x.humidityOffset}"></div>`).join('')}
async function saveChannels(){let channels=[...document.querySelectorAll('.channel')].map(e=>({channel:+e.dataset.ch,type:e.querySelector('.type').value,temperatureOffset:+e.querySelector('.to').value,humidityOffset:+e.querySelector('.ho').value}));await api('/api/v1/config/channels',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({channels})});alert('Saved')}
async function saveNetwork(){let b={dhcp:$('dhcp').checked,ssid:$('ssid').value,password:$('password').value,ip:$('ip').value,gateway:$('gateway').value,netmask:$('netmask').value,dns:$('dns').value};await api('/api/v1/config/network',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});alert('Saved. Reboot to apply.')}
async function post(u){await api(u,{method:'POST'});setTimeout(refresh,1000)}async function resetDevice(){if(confirm('Erase configuration and reboot?'))await post('/api/v1/factory-reset')}loadConfig();refresh();setInterval(refresh,5000);
</script></body></html>
